name: Profile migration checks

on:
  push:
    branches:
      - main
      - 'release/**'
    paths:
      - '**.ps1'
      - 'Start.cmd'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - '**.ps1'
      - 'Start.cmd'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-powershell:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run synthetic Windows PowerShell 5.1 tests
        shell: powershell
        run: .\tests\Run-Tests.ps1
